name: IgrejaUNASP
options:
  bundleIdPrefix: com.igrejaunaspec
  deploymentTarget:
    macOS: "14.0"
targets:
  IgrejaUNASP:
    type: application
    platform: macOS
    sources: [App/Sources, App/Resources]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Igreja UNASP EC
        CFBundleName: Igreja UNASP EC
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Igreja Adventista UNASP EC
    settings:
      base:
        PRODUCT_NAME: Igreja UNASP EC
        PRODUCT_BUNDLE_IDENTIFIER: com.igrejaunaspec.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
