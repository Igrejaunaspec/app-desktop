# Gera o programa para Mac (.dmg) e Windows (.exe) automaticamente.
# Roda sozinho a cada envio de arquivos, ou pelo botão "Run workflow" na aba Actions.
name: Gerar programa
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Igreja UNASP EC v__VERSION__'
          releaseBody: 'Baixe o arquivo .dmg (Mac) ou o .exe (Windows) abaixo.'
          releaseDraft: false
          args: ${{ matrix.args }}
